<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkWings</title>
    <link rel="stylesheet" href="./src/index.css" />
    <link rel="stylesheet" href="./src/animations.css" />
  </head>

  <body class="h-[500vh]">
    <header class="fixed -top-16 left-0 w-full z-[100] shadow-xl">
      <nav class="flex justify-between items-center py-3.5 px-16 backdrop-blur-md shadow-md">
        <div class="text-2xl font-bold text-blue-800">MarkWings</div>
        <ul class="flex space-x-4 ">
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><a href="#description">Description</a></li>
          <li><a href="#intro">Intro</a></li>
          <li><a href="#banner">Banner</a></li>
        </ul>
      </nav>

    </header>
    <main class="panelCon fixed bottom-0 left-0 w-full z-[90]">
      <section
        id="about"
        class="w-full h-screen flex items-center justify-center uppercase dotted-grid relative"
      ></section>
      <section
        id="contact"
        class="w-full h-screen flex items-center justify-center uppercase grid-bg relative"
      ></section>
      <section
        id="description"
        class="w-full h-screen flex justify-center items-start uppercase p-16 dotted-grid relative shadow-2xl"
      >
      <svg class="absolute h-screen w-screen -z-10">
        <line id="dev-line" stroke="black" stroke-width="1"/>
      </svg>     
      <svg class="absolute h-screen w-screen -z-10">
        <line id="graphics-line" stroke="black" stroke-width="1"/>
      </svg>
      <svg class="absolute h-screen w-screen -z-10">
        <line id="dm-line" stroke="black" stroke-width="1"/>
      </svg>
      <svg class="absolute h-screen w-screen -z-10">
        <line id="video-line" stroke="black" stroke-width="1"/>
      </svg>
      <svg class="absolute h-screen w-screen -z-10">
        <line id="smm-line" stroke="black" stroke-width="1"/>
      </svg>
        <div class="h-full w-full flex space-x-1 text-white">
          <div class="h-full w-1/3">
            <div class="h-1/2 w-full flex justify-end items-start px-6">
              <div id="desc-dev" class="h-3/4 w-1/2 rounded-full bg-blue-900 p-12 fade-in">
                Development
              </div>
            </div>
            <div class="h-1/2 w-full flex justify-start items-start px-6">
              <div id="desc-graphics" class="h-3/4 w-1/2 rounded-full bg-blue-900 p-12 fade-in">
                Graphics
              </div>
            </div>
          </div>
          <div class="h-full w-1/3">
            <div class="h-1/2 w-full flex justify-center items-start px-6">
              <div id="desc-dm" class="h-3/4 w-1/2 rounded-full bg-blue-900 p-12 fade-in">
                Digital Marketing
              </div>
            </div>
          </div>
          <div class="h-full w-1/3">
            <div class="h-1/2 w-full flex justify-star items-start px-6">
              <div id="desc-video" class="h-3/4 w-1/2 rounded-full bg-blue-900 p-12 fade-in">
                Video Editing
              </div>
            </div>
            <div class="h-1/2 w-full flex justify-end items-start px-6">
              <div id="desc-smm" class="h-3/4 w-1/2 rounded-full bg-blue-900 p-12 fade-in">
                SMM
              </div>
            </div>
          </div>
        </div>

        <div
          id="desc-bottom"
          class="h-fit w-fit p-2 bottom-20 absolute fade-in"
        >
          <div
            class="h-50 w-50 bg-white rounded-full drop-shadow-[0px_0px_16px_rgba(0,0,0,0.5)] relative"
          >
            <svg
              class="absolute left-[6.55rem] -translate-x-1/2 transform font-extrabold -top-2"
              width="200"
              height="200"
              viewBox="0 0 90 90"
            >
              <path
                d="M5,48 A2,2 0 0,1 80,48"
                fill="transparent"
                stroke="none"
                id="curveTop2"
              />
              <text fill="darkblue" font-size="5" text-anchor="middle">
                <textPath href="#curveTop2" startOffset="50%">
                  One Stop Solution for your Business
                </textPath>
              </text>
            </svg>
            <svg
              class="absolute left-[6.5rem] -translate-x-1/2 transform font-extrabold -bottom-7"
              width="200"
              height="200"
              viewBox="0 0 90 90"
            >
              <path
                d="M0,30 A5,5 0 0,0 85,30"
                fill="transparent"
                stroke="none"
                id="curveBottom2"
              />
              <text fill="darkblue" font-size="8" text-anchor="middle">
                <textPath href="#curveBottom2" startOffset="50%">
                  Get ~ Set ~ Grow
                </textPath>
              </text>
            </svg>
          </div>
        </div>
      </section>
      <section
        id="intro"
        class="w-full h-screen flex items-center uppercase grid-bg relative shadow-2xl"
      >
        <div id="intro-left" class="h-fit w-fit p-2 left-52 fade-in absolute">
          <div class="h-fit w-fit relative">
            <div
              class="absolute max-w-75 text-5xl text-blue-800 font-black z-1"
            >
              <h1 class="text-wrap">What is Markwings?</h1>
            </div>
            <div class="drop-shadow-[0px_0px_16px_rgba(0,0,0,0.2)]">
              <div
                class="h-100 w-160 bg-white rounded-4xl -rotate-3 clip-left-head"
              ></div>
            </div>
          </div>
        </div>
      </section>
      <section
        id="banner"
        class="w-full h-screen flex items-center justify-center uppercase dotted-grid relative"
      >
        <div id="banner-right" class="h-fit w-fit p-2 right-52 absolute">
          <div class="h-fit w-fit relative">
            <div
              class="absolute max-w-75 text-4xl text-blue-800 font-black z-1"
            >
              <h1 class="text-wrap">CTA Here</h1>
            </div>
            <div class="drop-shadow-[0px_0px_16px_rgba(0,0,0,0.2)]">
              <div
                class="h-80 w-120 bg-white rounded-4xl rotate-3 clip-left-head"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Scroll Progress Indicator -->
      <div
        id="scrollIndicator"
        title="Scroll to top"
        class="fixed right-5 bottom-5 z-50 flex h-15 w-15 cursor-pointer items-center justify-center rounded-full bg-gradient-to-t from-blue-800 to-white transition-all"
        style="width: 60px; height: 60px"
      >
        <svg
          class="absolute top-0 left-1/2 -translate-x-1/2 transform font-extrabold"
          width="60"
          height="60"
          viewBox="0 0 60 60"
        >
          <path
            d="M10,30 A20,20 0 1,1 50,30"
            fill="transparent"
            stroke="none"
            id="curveTop"
          />
          <text fill="white" font-size="10" text-anchor="middle">
            <textPath href="#curveTop" startOffset="50%">Get</textPath>
          </text>
        </svg>

        <div
          class="z-10 flex h-[60px] w-[60px] items-center justify-center rounded-full duration-500 font-bold"
        >
          <span class="text-white">Set</span>
        </div>

        <svg
          class="absolute -bottom-2.5 left-1/2 -translate-x-1/2 transform font-extrabold"
          width="60"
          height="60"
          viewBox="0 0 60 60"
        >
          <path
            d="M11,30 A20,20 0 0,0 50,30"
            fill="transparent"
            stroke="none"
            id="curveBottom"
          />
          <text fill="white" font-size="10" text-anchor="middle">
            <textPath
              href="#curveBottom"
              class="tracking-[0.2em]"
              startOffset="50%"
            >
              Grow
            </textPath>
          </text>
        </svg>
      </div>
    </main>
    <script type="module" src="./src/script/main.js"></script>
    <script type="module" src="./src/script/mouseTrail.js"></script>
    <script type="module" src="./src/script/scroller.js"></script>
    <script type="module" src="./src/script/fadeInAnimation.js"></script>
    <script type="module" src="./src/script/description.js"></script>
    <script type="module" src="./src/script/header.js"></script>

    <div
      id="container3D"
      class="fixed inset-0 z-[1000] pointer-events-none bg-transparent"
    ></div>
  </body>
</html>
